[package]
name = "monad-revmjs"
version = "0.1.0-preview.3"
description = "Browser WebAssembly bindings for monad-revm"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
monad-revm = { workspace = true, features = ["memory_limit", "optional_no_base_fee"] }
revm = { version = "=43.0.3", default-features = false }
serde = { workspace = true, features = ["derive", "alloc"] }
serde_json = "1"
wasm-bindgen = "=0.2.128"
