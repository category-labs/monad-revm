name: CI

concurrency:
  cancel-in-progress: true
  group: ${{github.workflow}}-${{github.ref}}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: Check all features
        run: cargo check --workspace --all-targets --all-features
      - name: Check no_std library
        run: cargo check --workspace --no-default-features --lib

  no-std:
    name: no_std (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - features: no features
            args: ''
          - features: memory_limit
            args: '--features memory_limit'
          - features: serde
            args: '--features serde'
          - features: serde, memory_limit
            args: '--features serde,memory_limit'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - name: Install bare-metal target
        run: rustup target add thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo check --workspace --lib --no-default-features
          --target thumbv7em-none-eabi ${{ matrix.args }}

  build:
    name: cargo build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --all-features

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: Test default features
        run: cargo test --workspace
      - name: Test all features
        run: cargo test --workspace --all-features
      - name: Test no default features
        run: cargo test --workspace --no-default-features

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features
        env:
          RUSTFLAGS: -Dwarnings

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  package:
    name: cargo publish dry run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p monad-revm --dry-run
