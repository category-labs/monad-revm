name: CI

concurrency:
  cancel-in-progress: true
  group: ${{github.workflow}}-${{github.ref}}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.91"
      - name: Check all features
        run: cargo check --workspace --all-targets --all-features
      - name: Check no_std library
        run: cargo check -p monad-revm --no-default-features --lib

  no-std:
    name: no_std (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - features: no features
            args: ''
          - features: memory_limit
            args: '--features memory_limit'
          - features: serde
            args: '--features serde'
          - features: serde, memory_limit
            args: '--features serde,memory_limit'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.91"
          target: thumbv7em-none-eabi
      - run: >-
          cargo check -p monad-revm --lib --no-default-features
          --target thumbv7em-none-eabi ${{ matrix.args }}

  build:
    name: cargo build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.91"
      - run: cargo build --workspace --all-targets --all-features

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.91"
      - name: Test default features
        run: cargo test --workspace
      - name: Test all features
        run: cargo test --workspace --all-features
      - name: Test no default features
        run: cargo test --workspace --no-default-features

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.91"
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features
        env:
          RUSTFLAGS: -Dwarnings

  fixtures:
    name: execution fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPEC_REVISION: 12e2c05bcfa6daeef9c0f4c54c5c7a13fde39e89
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned execution specs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: category-labs/monad-execution-specs
          ref: ${{ env.SPEC_REVISION }}
          path: .fixture-spec
          sparse-checkout: test/execution/fixtures/blockchain_tests
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.91"
      - name: Test fixture gate
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build fixture runner
        run: cargo build -p monad-fixtures
      - name: Replay and check fixtures
        run: >-
          python3 .github/scripts/fixture_ci.py
          --runner target/debug/monad-fixtures
          --fixtures .fixture-spec/test/execution/fixtures/blockchain_tests
          --report fixture-results/report.json
      - name: Upload fixture report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: execution-fixtures-${{ env.SPEC_REVISION }}
          path: fixture-results/report.json
          if-no-files-found: warn

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.91"
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check

  package:
    name: cargo publish dry run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.91"
      - run: cargo publish -p monad-revm --dry-run
