name: Publish Crate

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    name: publish monad-revm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.91 --profile minimal --component clippy --component rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Verify release tag
        shell: bash
        run: |
          crate_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "monad-revm") | .version'
          )"
          expected_tag="v${crate_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match monad-revm ${crate_version}"
            exit 1
          fi

      - name: Test all features
        run: cargo test --workspace --all-features

      - name: Test no default features
        run: cargo test --workspace --no-default-features

      - name: Publish dry run
        run: cargo publish -p monad-revm --dry-run

      - name: Publish to crates.io
        run: cargo publish -p monad-revm
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
